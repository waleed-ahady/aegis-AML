[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-aml"
version = "0.3.0"
description = "Production-oriented anti-money-laundering transaction monitoring platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "AegisAML Contributors" }]
keywords = ["anti-money-laundering", "fraud-detection", "machine-learning", "mlops", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
  "networkx>=3.3,<4",
  "prometheus-client>=0.21,<1",
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
streaming = ["confluent-kafka>=2.6,<3"]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
explain = ["shap>=0.46,<1"]
data = ["pyarrow>=17,<25", "kaggle>=1.6,<3"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6,<7",
]
all = [
  "confluent-kafka>=2.6,<3",
  "streamlit>=1.40,<2",
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "shap>=0.46,<1",
  "pyarrow>=17,<25",
  "kaggle>=1.6,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "types-PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/your-github-handle/aegis-aml"
Documentation = "https://github.com/your-github-handle/aegis-aml/tree/main/docs"
Issues = "https://github.com/your-github-handle/aegis-aml/issues"

[project.scripts]
aegis-aml = "aegis_aml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["aegis_aml"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
